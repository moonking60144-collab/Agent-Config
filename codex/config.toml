model = "gpt-5"
model_reasoning_effort = "medium"


[mcp_servers.context7]
command = "cmd"
args = ["/c", "npx", "-y", "@upstash/context7-mcp"]
env = { SystemRoot = 'C:\WINDOWS', COMSPEC = 'C:\WINDOWS\system32\cmd.exe'}
startup_timeout_ms = 20000

[mcp_servers.mcp-server-time]
command = "cmd"
args = ["/c", "uvx", "mcp-server-time", "--local-timezone=Asia/Shanghai"]
env = { SystemRoot = 'C:\WINDOWS', COMSPEC = 'C:\WINDOWS\system32\cmd.exe'}
startup_timeout_ms = 20000

[mcp_servers.mcp-deepwiki]
command = "cmd"
args = ["/c", "npx", "-y", "mcp-deepwiki@latest"]
env = { SystemRoot = 'C:\WINDOWS', COMSPEC = 'C:\WINDOWS\system32\cmd.exe'}
startup_timeout_ms = 20000

[mcp_servers.spec-workflow]
command = "cmd"
args = ["/c", "npx", "-y", "@pimzino/spec-workflow-mcp@latest"]
env = { SystemRoot = 'C:\WINDOWS', COMSPEC = 'C:\WINDOWS\system32\cmd.exe'}
startup_timeout_ms = 20000

[mcp_servers.sequential-thinking]
command = "cmd"
args = ["/c", "npx", "-y", "@modelcontextprotocol/server-sequential-thinking"]
env = { SystemRoot = 'C:\WINDOWS', COMSPEC = 'C:\WINDOWS\system32\cmd.exe'}
startup_timeout_ms = 20000

[mcp_servers.serena]
command = "cmd"
args = ["/c", "uvx", "--from", "git+https://github.com/oraios/serena", "serena", "start-mcp-server","--context","ide-assistant",
"--project","YOUR_PROJECT_PATH_HERE",
"--enable-web-dashboard","false",
"--enable-gui-log-window","false"]
env = { SystemRoot = 'C:\WINDOWS', COMSPEC = 'C:\WINDOWS\system32\cmd.exe'}
startup_timeout_ms = 20000

[mcp_servers.duckduckgo-search]
type = "stdio"
command = "cmd"
args = ["/c", "uvx",  "duckduckgo-mcp-server" ]
env = { SystemRoot = 'C:\WINDOWS', COMSPEC = 'C:\WINDOWS\system32\cmd.exe'}
startup_timeout_ms = 20000

[mcp_servers.github]
type = "stdio"
command = "cmd"
args = ["/c", "npx", "-y", "@modelcontextprotocol/server-github"]
env = { SystemRoot = 'C:\WINDOWS', COMSPEC = 'C:\WINDOWS\system32\cmd.exe', GITHUB_PERSONAL_ACCESS_TOKEN = 'YOUR_GITHUB_TOKEN_HERE' }
startup_timeout_ms = 20000

[mcp_servers.memory]
command = "cmd"
args = ["/c", "npx", "-y", "@modelcontextprotocol/server-memory"]
env = { SystemRoot = 'C:\WINDOWS', COMSPEC = 'C:\WINDOWS\system32\cmd.exe'}
startup_timeout_ms = 20000

[mcp_servers.firecrawl]
command = "cmd"
args = ["/c", "npx", "-y", "firecrawl-mcp"]
env = { SystemRoot = 'C:\WINDOWS', COMSPEC = 'C:\WINDOWS\system32\cmd.exe',FIRECRAWL_API_KEY = 'YOUR_FIRECRAWL_API_KEY_HERE'}
startup_timeout_ms = 20000
