#:schema https://developers.openai.com/codex/config-schema.json

# ============================================================================
# 可攜偏好範本。已移除「機器特定／自動生成」內容，換機器才不會帶壞設定：
#   - [mcp_servers.node_repl]：Codex 首次啟動會自行生成（command 指向
#     bin\<版本 hash>\node_repl.exe，每次更新就變，不可攜）。需要 Chrome
#     控制時由 Codex 重建，不要手動維護。
#   - [marketplaces.*]：原本的 local source 是本機 WSL 掛載路徑。
#   - [desktop.open-in-target-preferences.perPath]：原本含絕對專案路徑。
# 部署位置：~/.codex/config.toml。deploy.ps1 預設不覆蓋既有檔（用 -ForceCodex 才覆蓋）。
# ============================================================================

################################################################################
# 指令覆蓋
################################################################################
# deploy.ps1 會展開成該機器的 ~/.codex/base-instructions.md。
model_instructions_file = "__CODEX_HOME__/base-instructions.md"

developer_instructions = '''
請使用繁體中文回答，務必保持清晰、準確、技術導向、可執行。

全域 skill routing 的唯一 canonical 是 AGENTS.md §3.6。不要在 config.toml 或 skill body 重複維護 dispatch table；依 AGENTS.md §3.6 選擇 review、repo-onboarding-audit、agent-core-lite、agent-failure-debugging 或 agent-core-engine。

AGENTS.md 只保留全域常數與 skill routing；詳細 Observe -> Scope -> Plan -> Act -> Verify -> Report、品質閘門、失敗煞車與 completion gate 維護在 skills。簡單問答或單一明確設定不要儀式化，但一旦範圍擴大就切回對應 skill。

明確 read-only / review / 先分析時不改檔；使用者明確說「修、改、implement、直接做、同步、push」才進入實作或 git 動作。除非使用者明確要求，不自動 commit/push；破壞性操作必須先確認。

背景記憶策略：保持 Chronicle 與自動 memory generation 關閉；只讀取既有 memory。若對話中出現重要長期決策，可在同一回合用 one-shot 方式寫入短 memory note，且必須回報已記錄。

防禦性程式設計邊界：不要寫冗餘程式碼和過度防禦性程式碼；避免對已知型別使用 getattr、過度 isinstance、過度 try/except、為簡單方法寫冗餘 docstring，或替已知官方 API 加存在性檢查。
'''

################################################################################
# 核准與沙箱
################################################################################
approval_policy = "on-request"
sandbox_mode = "danger-full-access"

################################################################################
# 核心模型選擇
################################################################################
model = "gpt-5.5"
review_model = "gpt-5.5"

################################################################################
# 模型壓縮與工具輸出
################################################################################
# 明確指定模型 context window。
model_context_window = 1000000
# model_auto_compact_token_limit disabled: use Codex built-in auto compact default
tool_output_token_limit = 8000

################################################################################
# 推理與輸出詳細度
################################################################################
model_reasoning_effort = "high"
model_reasoning_summary = "detailed"
model_verbosity = "high"

################################################################################
# 集中式功能旗標
################################################################################
[features]
shell_tool = true
apply_patch_freeform = true
shell_snapshot = true
undo = true
unified_exec = true
multi_agent = true
steer = true
prevent_idle_sleep = true
child_agents_md = true
memories = true
chronicle = false
sqlite = true
fast_mode = false
powershell_utf8 = true
js_repl = false
# voice_transcription = true

[memories]
consolidation_model = "gpt-5.4"
extract_model = "gpt-5.4"
generate_memories = true
use_memories = true
disable_on_external_context = false
max_raw_memories_for_consolidation = 512
max_unused_days = 30
max_rollout_age_days = 45
# max_rollouts_per_startup = 16
# min_rollout_idle_hours = 6

[agents]
max_threads = 12
max_depth = 2

# 目前 schema 不支援在 agents.<role> 直接設定 model / sandbox_mode /
# model_reasoning_effort，因此這裡只保留角色描述。
[agents.default]
description = "General-purpose helper."

[agents.worker]
description = "Do not use this agent, it's silly named and not optimized for any particular role."

[agents.explorer]
description = "Fast codebase explorer for read-heavy tasks."

[agents.awaiter]
description = "Long-running command and task monitoring role."

[agents.reviewer]
description = "Reviewer agent for code reviews and feedback."

################################################################################
# Shell 環境策略
################################################################################
[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false
# exclude = []
# set = {}
# include_only = []
# experimental_use_profile = false

################################################################################
# 沙箱設定
################################################################################
[sandbox_workspace_write]
network_access = true
# writable_roots = []

################################################################################
# Windows 專用設定
################################################################################
[windows]

[plugins."github@openai-curated"]
enabled = true

[plugins."gmail@openai-curated"]
enabled = true

[plugins."google-drive@openai-curated"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

# MCP server versions are pinned; review upstream changelogs before bumping.
[mcp_servers.context7]
type = "stdio"
command = '__NPX_COMMAND__'
args = ["-y", "@upstash/context7-mcp@3.2.2"]
startup_timeout_ms = 40_000
enabled = true

[mcp_servers.context7.env]
SystemRoot = '__SYSTEM_ROOT__'
# __NPX_COMMAND__ and __SYSTEM_ROOT__ are replaced by deploy.ps1.
# On macOS/Linux, deploy.ps1 removes SystemRoot because it is Windows-only.

[mcp_servers.sequential-thinking]
type = "stdio"
command = '__NPX_COMMAND__'
args = ["-y", "@modelcontextprotocol/server-sequential-thinking@2025.12.18"]
startup_timeout_ms = 40_000
enabled = true

[mcp_servers.serena]
type = "stdio"
command = "uvx"
args = [
  "--from", "git+https://github.com/oraios/serena@v1.5.3",
  "serena", "start-mcp-server",
  "--context", "ide-assistant",
  "--enable-web-dashboard", "false",
  "--enable-gui-log-window", "false"
]
startup_timeout_ms = 40_000
enabled = true
# Global MCP mode: do not pass --project here. Activate the current repo/project through Serena before use.

[mcp_servers.playwright]
type = "stdio"
command = '__NPX_COMMAND__'
args = ["-y", "@playwright/mcp@0.0.77"]
startup_timeout_ms = 60_000
enabled = true

[desktop]
localeOverride = "zh-TW"
integratedTerminalShell = "__CODEX_TERMINAL_SHELL__"
runCodexInWindowsSubsystemForLinux = false
default-service-tier = "priority"

[desktop.open-in-target-preferences]
global = "fileManager"
